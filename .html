<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .parent {
            display: flex;
            width: 100%;
            inline-size: none;
            flex-wrap: wrap;
            border: 0.5px solid #000;
            background-image: url('https://www.w3schools.com/css/img_fjords.jpg');
            background-size: cover;
        }
        .child {
            width: 100px;
            height: 100px;
            color:black;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 5px;
            background-size: cover;
        }
        #child-1 {
            background-color: rgba(255, 0, 0, 0.5);
        }
        #child-2 {
            background-color: rgba(0, 255, 0, 0.5);
        }
        #child-3 {
            background-color: rgba(0, 0, 255, 0.5);
        }
        #child-4 {
            background-color: rgba(255, 255, 0, 0.5);
        }
        #child-5 {
            background-color: rgba(255, 0, 255, 0.5);
        }
        #child-6 {
            background-color: rgba(0, 255, 255, 0.5);
        }
        #child-7 {
            background-color: rgba(255, 165, 0, 0.5);
        }
        #child-8 {
            background-color: rgba(128, 0, 128, 0.5);
        }
        #child-9 {
            background-color: rgba(0, 128, 128, 0.5);
        }
    </style>
</head>
<body>

    <div class="parent">
        <div class="child" id="child-1">1</div>
        <div class="child" id="child-2">2</div>
        <div class="child" id="child-3">3</div>
        <div class="child" id="child-4">4</div>
        <div class="child" id="child-5">5</div>
        <div class="child" id="child-6">6</div>
        <div class="child" id="child-7">7</div>
        <div class="child" id="child-8">8</div>
        <div class="child" id="child-9">9</div>
    </div>

</body>
</html>
